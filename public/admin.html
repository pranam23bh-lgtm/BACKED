<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #030712; color: #f3f4f6; }
    .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto space-y-6">

  <!-- TOP BAR -->
  <header class="flex justify-between items-center bg-gray-900/80 p-4 rounded-2xl border border-gray-800">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-lg font-bold">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <h1 class="text-base font-extrabold text-white tracking-wide">ADMIN CONTROL CENTER</h1>
        <div class="text-xs text-amber-400 font-semibold flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> Live Netlify Engine Sync
        </div>
      </div>
    </div>
    <div class="text-right">
      <div class="text-xs text-gray-400">Server Round ID</div>
      <div id="adminRoundId" class="text-xl font-black text-white font-mono">#100001</div>
    </div>
  </header>

  <!-- METRICS OVERVIEW -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div class="glass p-5 rounded-2xl space-y-1">
      <div class="text-xs font-bold text-gray-400 uppercase">Total Users</div>
      <div id="statUsers" class="text-2xl font-black text-white">0</div>
    </div>
    <div class="glass p-5 rounded-2xl space-y-1 border-l-4 border-emerald-500">
      <div class="text-xs font-bold text-gray-400 uppercase">Approved Deposits</div>
      <div id="statDeposits" class="text-2xl font-black text-emerald-400">₹0.00</div>
    </div>
    <div class="glass p-5 rounded-2xl space-y-1 border-l-4 border-red-500">
      <div class="text-xs font-bold text-gray-400 uppercase">Approved Withdrawals</div>
      <div id="statWithdraws" class="text-2xl font-black text-red-400">₹0.00</div>
    </div>
  </div>

  <!-- FORCE OUTCOME CONTROL -->
  <div class="glass p-5 rounded-2xl space-y-4 border border-amber-500/30">
    <h2 class="text-sm font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-2">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Force Round Outcome
    </h2>
    <div class="grid grid-cols-4 gap-2">
      <button onclick="setOverride('AUTO')" id="btn-AUTO" class="py-2.5 rounded-xl font-extrabold text-xs bg-emerald-600 text-white">AUTO</button>
      <button onclick="setOverride('GREEN')" id="btn-GREEN" class="py-2.5 rounded-xl font-extrabold text-xs bg-gray-800 text-gray-300">GREEN</button>
      <button onclick="setOverride('WHITE')" id="btn-WHITE" class="py-2.5 rounded-xl font-extrabold text-xs bg-gray-800 text-gray-300">WHITE</button>
      <button onclick="setOverride('RED')" id="btn-RED" class="py-2.5 rounded-xl font-extrabold text-xs bg-gray-800 text-gray-300">RED</button>
    </div>
    <div class="text-xs text-gray-400">Current Forced Result: <span id="activeOverrideText" class="font-bold text-amber-400">AUTO</span></div>
  </div>

  <script>
    const socket = io(); // Connects to origin Render server

    socket.on('master_tick', (data) => {
      document.getElementById('adminRoundId').innerText = `#${data.roundId}`;
      updateOverrideUI(data.adminOverride);
    });

    function setOverride(color) {
      socket.emit('admin_set_override', color);
    }

    function updateOverrideUI(mode) {
      document.getElementById('activeOverrideText').innerText = mode;
      ['AUTO', 'GREEN', 'WHITE', 'RED'].forEach(m => {
        const btn = document.getElementById(`btn-${m}`);
        if (btn) {
          btn.className = m === mode ? 
            "py-2.5 rounded-xl font-extrabold text-xs bg-emerald-600 text-white" : 
            "py-2.5 rounded-xl font-extrabold text-xs bg-gray-800 text-gray-300";
        }
      });
    }

    async function fetchMetrics() {
      try {
        const res = await fetch('/api/admin/metrics');
        const data = await res.json();
        document.getElementById('statUsers').innerText = data.totalUsers;
        document.getElementById('statDeposits').innerText = `₹${parseFloat(data.totalDeposits).toLocaleString('en-IN')}`;
        document.getElementById('statWithdraws').innerText = `₹${parseFloat(data.totalWithdraws).toLocaleString('en-IN')}`;
      } catch (err) {}
    }
    fetchMetrics();
    setInterval(fetchMetrics, 5000);
  </script>
</body>
</html>
